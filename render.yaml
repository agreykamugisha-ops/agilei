services:
  - type: web
    name: gallant-corner
    env: node
    plan: free
    region: oregon
    branch: main
    rootDir: ./
    buildCommand: npm install --no-audit --no-fund && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@gallantcorner.co.tz
      - key: ADMIN_PASSWORD
        value: ChangeThisPassword123!
      - key: DB_HOST
        value: localhost
      - key: DB_USER
        value: root
      - key: DB_PASSWORD
        value: ""
      - key: DB_NAME
        value: gallant_corner
