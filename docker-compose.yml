services:
  gallant-corner:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gallant-corner
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      JWT_SECRET: replace_with_strong_secret
      ADMIN_EMAIL: admin@gallantcorner.co.tz
      ADMIN_PASSWORD: ChangeThisPassword123!
      DB_HOST: localhost
      DB_USER: root
      DB_PASSWORD: ""
      DB_NAME: gallant_corner
      VITE_API_URL: http://localhost:4000
    restart: unless-stopped
